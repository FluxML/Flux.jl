name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'

# needed for julia-actions/cache to delete old caches
permissions:
  actions: write
  contents: read

# cancel superseded in-progress runs on the same ref, but never on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.group == 'reactant' && ' - Reactant' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'    # latest stable 1.x release
          # - 'pre'  # latest stable prerelease
          - 'nightly' # latest nightly release
        os: [ubuntu-latest]
        arch: [x64]
        group: [core]
        include:
          - os: windows-latest
            version: '1'
            arch: x64
          - os: macOS-latest
            version: '1'
            arch: aarch64
            # The 7 GB runner can't fit two test workers: it swaps, GC thrashes, and the job stalls for hours.
            ptr_jobs: 1
          # The Reactant tests get their own job, the only one that installs Reactant: it is slow
          # to test, and it holds back versions of some dependencies.
          - os: ubuntu-latest
            version: '1'
            arch: x64
            group: reactant
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          PTR_NUM_JOBS: ${{ matrix.ptr_jobs }}
          FLUX_TEST_REACTANT: ${{ matrix.group == 'reactant' }}
          # runtests.jl precompiles once it has added Reactant, which changes some versions;
          # Pkg.test's own precompile beforehand would be wasted
          JULIA_PKG_PRECOMPILE_AUTO: 0
        with:
          # --verbose prints when each test starts, so a stalled test can be identified
          test_args: ${{ matrix.group == 'reactant' && '--verbose ext_reactant' || '--verbose' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
