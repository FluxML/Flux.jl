[project]
name = "gpt2-fineweb-pytorch"
version = "0.1.0"
description = "PyTorch port of the Flux GPT-2 pretraining example"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14",
    "numpy",
    "tokenizers",
    "datasets>=5.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
