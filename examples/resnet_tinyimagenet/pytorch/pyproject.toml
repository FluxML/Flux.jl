[project]
name = "resnet-tinyimagenet-pytorch"
version = "0.1.0"
description = "PyTorch port of the Flux ResNet-18 / Tiny-ImageNet example"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14",
    "datasets>=4.0",
    "pillow",
    "numpy",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
